<!DOCTYPE html>
<meta charset="utf-8">
<title>Thomas Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thomas Budget">
<meta name="description" content="Monthly household budget for the Thomas family — income, expenses, wealth building, balances and charts, shared between the two of you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f0; --surface:#ffffff; --surface-2:#e9ece4; --surface-3:#dfe3da;
  --ink:#171b17; --ink-2:#555d55; --ink-3:#848b84;
  --line:#dde1d7; --line-2:#c6ccc0;
  --accent:#0f6e56; --accent-ink:#ffffff; --accent-soft:#dcefe7; --accent-line:#8fc8b4;
  --good:#1a7f37; --good-soft:#e1f3e6; --bad:#bf352e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fbefd2;
  --s-income:#2a78d6; --s-exp:#eb6834; --s-wealth:#1baf7a; --s-abn:#eda100; --s-ret:#4a3aa7; --s-debt:#e34948;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 18px 50px rgba(18,28,20,.16), 0 2px 6px rgba(18,28,20,.06);
  --r:10px; --r-s:6px;
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131613; --surface:#1c201c; --surface-2:#252a25; --surface-3:#2f352f;
    --ink:#f1f3ee; --ink-2:#b5bcb3; --ink-3:#7f877f;
    --line:#2c322c; --line-2:#3c433c;
    --accent:#4dbb97; --accent-ink:#0b1a13; --accent-soft:#1c3a2f; --accent-line:#2f6b57;
    --good:#5ccc77; --good-soft:#1b3323; --bad:#f0837a; --bad-soft:#3f2321; --warn:#f2c057; --warn-soft:#3b3012;
    --s-income:#3987e5; --s-exp:#d95926; --s-wealth:#199e70; --s-abn:#c98500; --s-ret:#9085e9; --s-debt:#e66767;
    --grid:#2c2f2c; --axis:#3d423d;
    --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131613; --surface:#1c201c; --surface-2:#252a25; --surface-3:#2f352f;
  --ink:#f1f3ee; --ink-2:#b5bcb3; --ink-3:#7f877f;
  --line:#2c322c; --line-2:#3c433c;
  --accent:#4dbb97; --accent-ink:#0b1a13; --accent-soft:#1c3a2f; --accent-line:#2f6b57;
  --good:#5ccc77; --good-soft:#1b3323; --bad:#f0837a; --bad-soft:#3f2321; --warn:#f2c057; --warn-soft:#3b3012;
  --s-income:#3987e5; --s-exp:#d95926; --s-wealth:#199e70; --s-abn:#c98500; --s-ret:#9085e9; --s-debt:#e66767;
  --grid:#2c2f2c; --axis:#3d423d;
  --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
:root[data-theme="dark"]{
  --bg:#131613; --surface:#1c201c; --surface-2:#252a25; --surface-3:#2f352f;
  --ink:#f1f3ee; --ink-2:#b5bcb3; --ink-3:#7f877f;
  --line:#2c322c; --line-2:#3c433c;
  --accent:#4dbb97; --accent-ink:#0b1a13; --accent-soft:#1c3a2f; --accent-line:#2f6b57;
  --good:#5ccc77; --good-soft:#1b3323; --bad:#f0837a; --bad-soft:#3f2321; --warn:#f2c057; --warn-soft:#3b3012;
  --s-income:#3987e5; --s-exp:#d95926; --s-wealth:#199e70; --s-abn:#c98500; --s-ret:#9085e9; --s-debt:#e66767;
  --grid:#2c2f2c; --axis:#3d423d;
  --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{overflow-x:clip}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 56px}

/* ---- top bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .theme{width:30px;height:30px;color:var(--ink-3);flex:none} .brand .theme:hover{color:var(--accent);background:var(--accent-soft)} .brand .theme svg{width:17px;height:17px}
.brand .name{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;font-variation-settings:"opsz" 96;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.app-title-inp{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;padding:2px 6px;border:1px solid var(--accent-line);border-radius:6px;width:min(60vw,260px);min-width:0}
.top nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex:none}
#who{display:flex;gap:6px;align-items:center}#who .btn{white-space:nowrap}
.brand{min-width:0}.brand .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.ok .dot{background:var(--good)} .pill.busy .dot{background:var(--s-abn)} .pill.local .dot{background:var(--ink-3)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg,.hero-side .hint svg,.badge svg,.tab svg{width:14px;height:14px;flex:none}
.icon{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;color:var(--ink-3);padding:0}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon svg{width:15px;height:15px}
.chartbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:3px 9px 3px 7px;font-weight:600}
.chartbtn:hover{filter:brightness(.96)}
.chartbtn svg{width:13px;height:13px}

/* ---- typography ---- */
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0;font-variation-settings:"opsz" 96}
h1{font-size:34px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---- sections ---- */
.section{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.sec-head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card.click{cursor:pointer;transition:border-color .15s, transform .15s}
.card.click:hover{border-color:var(--accent-line)}

/* ---- home hero ---- */
.hero{margin-top:28px;display:grid;grid-template-columns:minmax(0,560px);gap:20px}
.sw{width:9px;height:9px;border-radius:3px;flex:none}
.sw.income{background:var(--s-income)} .sw.exp{background:var(--s-exp)} .sw.abn{background:var(--s-abn)} .sw.wealth{background:var(--s-wealth)} .sw.ret{background:var(--s-ret)} .sw.debt{background:var(--s-debt)}
.hero-side{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.hero-side .donut-wrap{display:flex;align-items:center;gap:16px;flex:1;cursor:pointer;border-radius:8px;padding:6px}
.hero-side .click:hover .donut-wrap{background:var(--surface-2)}
.hero-side svg{width:150px;height:150px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.legend .li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.legend .li .v{font-weight:600}
.hero-side .hint{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}

/* ---- months table ---- */
.pick{padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pick label{color:var(--ink-2);font-size:13px;font-weight:500}
.sel{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:9px 12px;font-size:15px;min-height:40px;max-width:100%;font-family:var(--body)}
.mhead .sel{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;border-color:transparent;background:transparent;padding:4px 28px 4px 6px;appearance:auto;min-width:0;flex:1 1 auto;width:auto;text-overflow:ellipsis}
.mhead .sel:hover{background:var(--surface-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- cards grid (trend / debt / balances) ---- */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.kcard{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard .big{font-size:26px;font-weight:600;letter-spacing:-.02em}
.kcard .delta{font-size:12.5px;color:var(--ink-2)}
.kcard svg.spark{width:100%;height:56px;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv .k{color:var(--ink-2)} .kv .v{font-weight:600}

/* ---- month view ---- */
.mhead{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhead .nav{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.mhead h1{font-size:30px}
.mhead .upd{color:var(--ink-3);font-size:12.5px;margin-left:8px;white-space:nowrap}
.back{margin-top:16px;padding-left:6px}
.back svg{width:14px;height:14px}
.mhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.perf{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;justify-content:flex-start}
.perf .p{padding:7px 12px;display:flex;flex-direction:column;gap:1px;cursor:pointer;min-width:0;text-align:left;color:var(--ink)}
.perf .p:hover{border-color:var(--accent-line)}
.perf .p .lab{font-size:11px;color:var(--ink-2);font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.perf .p .v{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.perf .btn{align-self:center}
.okv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
.okv .k{color:var(--ink-2)} .okv .v{font-weight:500;white-space:nowrap}
.okv .tot{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.outlook-t .grp th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:12px}
.outlook-t tr.pred td:last-child{font-weight:600}
.list{display:flex;flex-direction:column;margin-top:20px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 18px;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);min-height:56px}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow .t{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lrow .n{font-size:12px;color:var(--ink-3);font-weight:400}
.lrow .v{font-weight:600;white-space:nowrap}
.lrow svg{width:18px;height:18px;color:var(--ink-3)}
.sw.none{background:var(--line-2)}
.col-body{padding:6px 0 4px;display:flex;flex-direction:column;gap:2px}
.dlg-body.editor{padding:8px 10px 10px}
.dlg-body .list .lrow{padding:14px 10px}
.chrow{grid-template-columns:118px minmax(0,1fr) 92px auto 22px}
.chrow input[type=date]{font-size:13px;padding:5px 4px}
.chrow .paid{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);white-space:nowrap} .chrow .paid input{width:16px;height:16px;margin:0}
.ch-title{display:flex;align-items:center;gap:6px;min-width:0} .ch-title .pencil{width:26px;height:26px;color:var(--ink-3);flex:none} .ch-title .pencil:hover{color:var(--accent);background:var(--accent-soft)}
.ch-title-inp{font:inherit;font-size:19px;font-weight:600;padding:2px 6px;border:1px solid var(--accent-line);border-radius:6px;min-width:0;width:min(100%,280px)}
.lwrap{position:relative;border-bottom:1px solid var(--line);touch-action:pan-y} .lwrap:last-child{border-bottom:0}
.trends-list .lrow{touch-action:pan-y;background:var(--surface);border-bottom:0;position:relative;z-index:1}
.swipe-hint{position:absolute;inset:0;z-index:0;background:var(--accent-soft);display:none;pointer-events:none}
.swipe-flag{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:3;display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:none;pointer-events:none}
.swipe-flag svg{width:14px;height:14px}
.lwrap.moving .swipe-hint,.lwrap.moving .swipe-flag{display:flex}
.del-hint{position:absolute;inset:0;z-index:0;background:var(--bad-soft);display:none;pointer-events:none}
.del-flag{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:3;display:none;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;pointer-events:none}
.del-flag svg{width:13px;height:13px}
.lwrap.deleting .del-hint,.lwrap.deleting .del-flag{display:flex}
.lwrap.deleting.armed .del-flag{background:var(--bad);color:#fff}
.lwrap.moving,.lwrap.deleting{box-shadow:var(--shadow);border-radius:10px;border-bottom-color:transparent;z-index:2}
.list.arranging{cursor:grabbing;user-select:none}
.arow{grid-template-columns:minmax(0,1fr) 92px 22px;grid-template-areas:"label amt del" "tags tags tags";padding:6px 2px 8px 6px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow>input[data-f=blabel]{grid-area:label} .arow .amtw{grid-area:amt} .arow>.icon{grid-area:del}
.arow .tags{grid-area:tags;display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 0 4px}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:pointer}
.tag.value{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.owed{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.imp-row{margin-top:14px}
.txrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 6px;border-bottom:1px solid var(--line);align-items:start}
.txrow:last-child{border-bottom:0} .txrow.dupe{opacity:.45}
.txrow .d{font-size:14px;overflow-wrap:anywhere} .txrow .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.txrow .amt.pos{color:var(--good)}
.txrow .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
.txrow select,.txrow .newcat{flex:1;min-width:0;font-size:13px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit}
.paidbox{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.paidbox .srcsel{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:150px;color:var(--ink-2);font-family:inherit}
.paidbox .paidval{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.paidbox input{width:86px;text-align:right;font-size:15px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:inherit;font-variant-numeric:tabular-nums}
.rt-form{display:grid;grid-template-columns:minmax(0,1fr) 86px auto;gap:8px 10px;align-items:center;padding:10px;background:var(--surface-2);border-radius:var(--r-s);margin:0 0 14px;font-size:14px}
.rt-form label{display:contents} .rt-form label>span:first-child{color:var(--ink-2)}
.rt-form input{text-align:right;font-variant-numeric:tabular-nums;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%;min-width:0;font-family:inherit}
.rt-form label>span:last-child{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
@media (max-width:420px){ .lwrap{position:relative;border-bottom:1px solid var(--line);touch-action:pan-y} .lwrap:last-child{border-bottom:0}
.trends-list .lrow{touch-action:pan-y;background:var(--surface);border-bottom:0;position:relative;z-index:1}
.swipe-hint{position:absolute;inset:0;z-index:0;background:var(--accent-soft);display:none;pointer-events:none}
.swipe-flag{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:3;display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:none;pointer-events:none}
.swipe-flag svg{width:14px;height:14px}
.lwrap.moving .swipe-hint,.lwrap.moving .swipe-flag{display:flex}
.del-hint{position:absolute;inset:0;z-index:0;background:var(--bad-soft);display:none;pointer-events:none}
.del-flag{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:3;display:none;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;pointer-events:none}
.del-flag svg{width:13px;height:13px}
.lwrap.deleting .del-hint,.lwrap.deleting .del-flag{display:flex}
.lwrap.deleting.armed .del-flag{background:var(--bad);color:#fff}

/* Appreciation assets: what the home is worth, the mortgages against it, and the equity in between.
   The Home equity line under wealth building is the principal paid, so entering it comes straight off the

const TRENDS_DEFAULTS = ['trend', 'savings', 'retire', 'retained', 'outlook', 'equity', 'debt', 'balances'];

    if (k === 'value') { value += a; nValue++; } else if (k === 'owed') { owed += a; nOwed++; } else other += a; }

}
const accountsNet = m => equityStats(m).net;
const owedRows = m => ((m && m.accounts) || []).filter(r => rowKind(r) === 'owed');
const equityLines = m => ((m && m.wealth) || []).filter(l => /equity/i.test(l.label || '')); // only the Home equity lines
const rowPaid = r => r2(+r.paid || +r.applied || 0); // what has already come off this month
const paidTotal = m => r2(owedRows(m).reduce((s, r) => s + rowPaid(r), 0));

}

function secTotal(m, k) { if (k === 'budgets') return budgetStats(m).spent; const c = calc(m); return k==='income'?c.net:k==='expenses'?c.exp:k==='abnormal'?c.abn:k==='wealth'?c.wealth:k==='cards'?c.cc:k==='savings'?c.cash:accountsNet(m); }
/* Budgets: a name and a limit; spending is whatever the Expenses line with the same name adds up to. */
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

/* Each window takes a history entry of its own, so the phone's back button walks back through them

const navStack = []; let navLock = false, navAfter = null, navGuard = false, navIgnore = 0, navAt = 0, navClosing = false;
const navHold = () => { if (!navGuard) { navGuard = true; try { history.pushState({ dlg: 1 }, ''); } catch (e) { navGuard = false; } } };
function navOpen(fn, args) { if (navLock) { fn(...args); return; } navStack.push([fn, args]); navHold(); fn(...args); }
function navStep() { // one window back, closing the last one
  navAt = Date.now(); navStack.pop();
  const top = navStack[navStack.length - 1];
  if (top) { navLock = true; try { top[0](...top[1]); } finally { navLock = false; } } else closeOverlay();
}
const navBack = () => { if (navStack.length) navStep(); };
function navDrop(after) { // every window left behind: give the one entry back
  navStack.length = 0;
  if (navGuard) { navGuard = false; navIgnore++; navAfter = after || null; history.back(); }
  else if (after) after();
}
window.addEventListener('popstate', () => {
  if (navIgnore > 0) { navIgnore--; const a = navAfter; navAfter = null; if (a) a(); return; }
  const justStepped = Date.now() - navAt < 350; // some phones both close the dialog and pop: only step once
  navGuard = false;
  if (!navStack.length) return;
  if (!justStepped) navStep();

/* ---------- importing a bank statement ----------
   The file is read here in the browser and never uploaded anywhere. A statement is turned into rows,
   each row is given a category to file it under, and only then does anything touch a month. */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/';
let pdfLib = null;
async function pdfjs() { if (!pdfLib) { pdfLib = await import(PDFJS + 'pdf.min.mjs'); pdfLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs'; } return pdfLib; }
const MONEY = /^-?\$?[\d,]+\.\d\d$/;
const money = s => parseFloat(String(s).replace(/[$,]/g, ''));

async function pdfRows(file) { // every page as rows of {x, s}, top to bottom
  const lib = await pdfjs(), doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const c = await (await doc.getPage(p)).getTextContent(), rows = new Map();
    for (const it of c.items) {
      const s = it.str.trim(); if (!s) continue;
      const y = Math.round(it.transform[5]), k = [...rows.keys()].find(v => Math.abs(v - y) <= 2);
      const key = k === undefined ? y : k; if (!rows.has(key)) rows.set(key, []); rows.get(key).push({ x: it.transform[4], s });
    }
    for (const [, cells] of [...rows.entries()].sort((a, b) => b[0] - a[0])) out.push(cells.sort((a, b) => a.x - b.x));
  }
  return out;
}
function statementYears(rows) { // "July 22, 2026 through August 21, 2026"
  const line = rows.map(r => r.map(c => c.s).join(' ')).find(t => /through/i.test(t) && /\b(19|20)\d\d\b/.test(t)) || '';
  const ys = (line.match(/\b(19|20)\d\d\b/g) || []).map(Number);
  const ms = (line.match(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\b/gi) || [])
    .map(x => MONTH_NAMES.findIndex(n => n.toLowerCase() === x.toLowerCase()) + 1);
  const now = new Date();
  return { m0: ms[0] || 1, y0: ys[0] || now.getFullYear(), y1: ys[ys.length - 1] || ys[0] || now.getFullYear() };
}
function txnsFromPdf(rows) {
  const { m0, y0, y1 } = statementYears(rows), out = [];
  let cur = null;
  for (const cells of rows) {
    const first = cells[0]; if (!first) continue;
    const text = cells.map(c => c.s).join(' ');
    const dated = /^\d{1,2}\/\d{1,2}$/.test(first.s);
    const amt = cells.find(c => c.x > 380 && c.x < 480 && MONEY.test(c.s));
    if (dated && amt && !/beginning balance|ending balance|total/i.test(text)) {
      const [mm, dd] = first.s.split('/').map(Number);
      const year = mm >= m0 ? y0 : y1;
      const desc = cells.filter(c => c.x > first.x + 8 && c.x < 380).map(c => c.s).join(' ').replace(/\s+/g, ' ').trim();
      cur = { date: `${year}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`, desc, amount: money(amt.s) };
      out.push(cur);
    } else if (cur && !dated && cells.every(c => c.x < 380) && first.x > 60 && cells.length <= 3 && !/^\*/.test(first.s)) {
      cur.desc = (cur.desc + ' ' + cells.map(c => c.s).join(' ')).replace(/\s+/g, ' ').trim(); // a wrapped description
    }
  }
  for (const t of out) t.desc = cleanDesc(t.desc) || t.desc;
  return out;
}
function txnsFromCsv(text) {
  const rows = text.split(/\r?\n/).filter(l => l.trim()).map(l => { const out = []; let cur = '', q = false;
    for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; }
    out.push(cur); return out.map(s => s.trim().replace(/^"|"$/g, '')); });
  if (!rows.length) return [];
  const head = rows[0].map(s => s.toLowerCase());
  const iDate = head.findIndex(s => /date/.test(s)), iDesc = head.findIndex(s => /desc|payee|merchant|name/.test(s)), iAmt = head.findIndex(s => /amount|debit/.test(s));
  if (iDate < 0 || iAmt < 0) return [];
  const out = [];
  for (const r of rows.slice(1)) {
    const d = new Date(r[iDate]); if (isNaN(d) || !r[iAmt]) continue;
    out.push({ date: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
      desc: (r[iDesc] || '').replace(/\s+/g, ' ').trim(), amount: money(r[iAmt]) });
  }
  return out;
}

/* ---------- what to file each one under ---------- */
const CAT_HINTS = [
  [/walmart|kroger|aldi|trader joe|schnucks|dierbergs|hy-?vee|costco|sam.?s club|grocer/i, 'expenses:Groceries'],
  [/mcdonald|chipotle|starbucks|panera|pizza|taco|burger|doordash|grubhub|sonic|culver|chick|restaurant|cafe|coffee/i, 'expenses:Eating out'],
  [/shell|quiktrip|circle k|phillips 66|exxon|mobil|casey|\bbp\b|\bqt\b|fuel|gas station/i, 'expenses:Gas for heating/oven'],
  [/ameren|spire|electric|water|sewer|utility/i, 'expenses:Electricity'],
  [/at&t|verizon|vzwrlss|t-?mobile|spectrum|comcast|internet|wireless|prepaid/i, 'expenses:Bills'],
  [/netflix|spotify|hulu|disney|paramount|peacock|apple\.com\/bill|subscription|prime video/i, 'expenses:Subscription Services'],
  [/insurance|geico|state farm|progressive|allstate|farmers ins/i, 'expenses:Insurance'],
  [/jesuschrist|tithing|donation|church/i, 'expenses:Tithing'],
  [/mortgage|home improvement loan|rent payment/i, 'expenses:Mortgage / rent'],
  [/credit crd autopay|discover|capital one|amex|american express|card payment|cardmember/i, 'expenses:Credit Card payment'],
  [/robinhood|coinbase|vanguard|fidelity|betterment|schwab|401k|acorns/i, 'wealth:Robinhood'],
  [/payroll|direct dep|dir dep|salary/i, 'income:Paycheck 1'],
];
function merchantKey(desc) {
  return String(desc).toLowerCase()
    .replace(/\d{1,2}\/\d{1,2}/g, ' ').replace(/(web|ppd|ccd|trace) id:?\s*\w+/g, ' ').replace(/card\s*\d+/g, ' ')
    .replace(/\b\d{3,}\b/g, ' ').replace(/[^a-z& ]+/g, ' ')
    .replace(/\b(recurring|card|purchase|payment|payments|debits?|credits?|ach|pos|dbt|tst|sq|autopay|e|online|transfer|withdrawal|deposit|id|web|ppd|ccd|inc|llc|com)\b/g, ' ')
    .replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
}
function suggestCat(m, t) {
  const key = merchantKey(t.desc);
  if (key && S.catMap && S.catMap[key]) return S.catMap[key];
  for (const col of ['expenses', 'income', 'wealth', 'abnormal']) // a line whose name already appears in the description
    for (const l of m[col] || []) { const lab = norm(l.label); if (lab.length > 3 && norm(t.desc).includes(lab)) return col + ':' + l.label; }
  for (const [re, cat] of CAT_HINTS) if (re.test(t.desc)) { const [col, label] = cat.split(/:(.*)/);
    const has = (m[col] || []).find(l => norm(l.label) === norm(label)); return col + ':' + (has ? has.label : label); }
  return t.amount > 0 ? 'income:' + (((m.income || [])[0] || {}).label || 'Paycheck 1') : '';
}
const cleanDesc = s => String(s)
  .replace(/^(recurring\s+)?card purchase( with pin)?\s*\d{1,2}\/\d{1,2}\s*/i, '')
  .replace(/\s*(web|ppd|ccd|arc|tel|trace)\s*id:?\s*\S+/ig, '')
  .replace(/\s*card\s*\d{4}\b/ig, '')
  .replace(/\s+\d{6,}\b/g, '')
  .replace(/\s{2,}/g, ' ').trim();
const fingerprint = t => `${t.date}|${Math.round(Math.abs(t.amount) * 100)}|${merchantKey(t.desc).slice(0, 14)}`;

/* ---------- Ask Budget: plain-English questions answered from the months ---------- */
function budgetDigest() {
  const keys = sortedKeys(), out = ['Budget: ' + appTitle() + '. Today: ' + today() + '. All amounts are US dollars. "kept" means net income minus expenses, abnormal and wealth building. Lines under income, expenses, wealth and abnormal are flows during that month (wealth = money moved into savings or investments that month, not a balance). card balance, savings and asset lines are balances as of that month.'];
  for (const k of keys.slice(-24)) { const m = S.months[k], c = calc(m);
    out.push(`\n== ${monthLabel(k)} (${k}) — net income ${c.net}, expenses ${c.exp}, abnormal ${c.abn}, wealth building ${c.wealth}, kept ${c.retained}, credit-card balance ${c.cc}, savings in cash ${c.cash}`);
    for (const col of ['income', 'expenses', 'wealth', 'abnormal'])
      for (const l of m[col] || []) if (l.label.trim() && lineAmt(l)) out.push(`${col} ${l.label}: ${lineAmt(l)}`);
    for (const b of m.budgets || []) if (b.label) out.push(`budget cap ${b.label}: ${b.amount}`);
    for (const x of m.cards || []) if (x.label && +x.amount) out.push(`card balance ${x.label}: ${x.amount}`);
    for (const x of m.savings || []) if (x.label && +x.amount) out.push(`savings ${x.label}: ${x.amount}`);
    for (const x of m.accounts || []) if (x.label && +x.amount) out.push(`asset ${x.label}${x.kind ? ' (' + x.kind + ')' : ''}: ${x.amount}`);
  }
  for (const k of keys.slice(-3)) { const m = S.months[k], its = [];
    for (const col of ['income', 'expenses', 'wealth', 'abnormal'])
      for (const l of m[col] || []) for (const it of l.items || []) if (+it.amount) its.push(`${monthLabel(k)} ${l.label} — ${it.label}: ${it.amount}${it.note ? ' (' + it.note + ')' : ''}`);
    if (its.length) out.push(`\n== Individual entries, ${monthLabel(k)}:`, ...its);
  }
  return out.join('\n').slice(0, 30000);
}
function askBody() {
  const rows = S.ask.map(x => `<div class="askrow"><div class="q">${esc(x.q)}</div><div class="a${x.a === null ? ' muted' : ''}">${x.a === null ? 'Thinking…' : esc(x.a)}</div></div>`).join('');
  return `${rows || `<p class="chart-note">Ask anything about your numbers — “what did we spend on groceries last month?”, “how are the credit cards trending?”, “what did all the Walmart runs add up to?” The answer is read from this budget's own months and stays between you and it.</p>`}
    <div class="askbar"><input type="text" id="ask-q" placeholder="Ask about your budget…" autocomplete="off" enterkeyhint="send"><button class="btn primary sm" data-act="ask-send">Ask</button></div>`;
}
function openAsk() {
  dialogCtx = { key: null, sec: 'ask' };
  openOverlay(`<div class="dlg-head">${pageBack()}<div class="ttl"><h2>Ask Budget</h2><span class="muted" style="font-size:13px">Questions about your numbers, answered from this budget's data</span></div></div>
    <div class="dlg-body editor">${askBody()}</div>`);
  dlg.style.maxWidth = '560px';
  scrollAsk(); const i = $('#ask-q', dlg); if (i) i.focus();
}
function scrollAsk() { const b = $('.dlg-body.editor', dlg); if (b) b.scrollTop = b.scrollHeight; }
async function askSend() {
  const inp = $('#ask-q', dlg), q = inp && inp.value.replace(/\s+/g, ' ').trim();
  if (!q) { if (inp) inp.focus(); return; }
  if (S.ask.some(x => x.a === null)) return; // one at a time
  if (!FB || !FB.auth.currentUser) { toast('Sign in to ask'); return; }
  const entry = { q: q.slice(0, 400), a: null };
  S.ask.push(entry); if (S.ask.length > 12) S.ask = S.ask.slice(-12);
  refreshEditor(); scrollAsk();
  try {
    const token = await FB.auth.currentUser.getIdToken();
    const res = await fetch('/api/ask', { method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
      body: JSON.stringify({ question: entry.q, digest: budgetDigest(), history: S.ask.filter(x => x.a && x !== entry).slice(-4) }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'The AI is unavailable right now');
    entry.a = String((await res.json()).answer || '').trim() || 'No answer came back — try again.';
  } catch (e) { console.error(e); entry.a = (e && e.message) || 'The AI is unavailable right now'; }
  const show = () => { if (dialogCtx.sec === 'ask') { refreshEditor(); scrollAsk(); const i2 = $('#ask-q', dlg); if (i2) i2.focus(); } };
  if (!isEditing()) show(); // mid-typing: wait, same pattern as the categorizer
  else { const w = setInterval(() => { if (!isEditing()) { clearInterval(w); show(); } }, 350); }
}

/* ---------- the review window: nothing is committed until Add is tapped ---------- */
const aiWants = t => !t.dupe && !t.user && !t.learned && !t.newCat && S.months[t.key]; // rows the AI may fill: not filed by a person, in a month that exists
function aiStrip(im) {
  if (!S.user || !im.rows.some(aiWants)) return '';
  return `<div style="padding:0 6px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="imp-ai"${im.ai === 'busy' ? ' disabled' : ''}>${im.ai === 'busy' ? 'Asking the AI…' : '✨ Let AI suggest categories'}</button>${im.aiNote ? `<span class="muted" style="font-size:12px">${esc(im.aiNote)}</span>` : ''}</div>`;
}
async function aiSuggest() {
  const im = S.imp; if (!im || im.ai === 'busy' || !FB || !FB.auth.currentUser) return;
  const want = im.rows.map((t, i) => ({ t, i })).filter(x => aiWants(x.t));
  if (!want.length) return;
  im.ai = 'busy'; im.aiNote = ''; refreshEditor();
  try {
    const token = await FB.auth.currentUser.getIdToken();
    const cats = new Set(); // his own category names, from every month the statement touches
    for (const k of new Set([im.key, ...im.rows.map(t => t.key)])) { const m = S.months[k]; if (!m) continue;
      for (const col of ['expenses', 'income', 'wealth', 'abnormal']) for (const l of m[col] || []) if (l.label.trim()) cats.add(col + ':' + l.label); }
    let applied = 0;
    for (let at = 0; at < want.length; at += 80) { // the worker takes 80 at a time
      const res = await fetch('/api/ai', { method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ cats: [...cats], txns: want.slice(at, at + 80).map(x => ({ i: x.i, desc: x.t.desc.slice(0, 90), amount: r2(x.t.amount) })) }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'The AI is unavailable right now');
      for (const p of (await res.json()).picks || []) {
        const t = im.rows[p.i]; if (!t || !aiWants(t) || typeof p.cat !== 'string') continue;
        const cut = p.cat.indexOf(':'); if (cut < 1) continue;
        const label = p.cat.slice(cut + 1).replace(/[^\w&\/'’. -]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
        const cat = label && ['expenses', 'income', 'wealth', 'abnormal'].includes(p.cat.slice(0, cut)) ? p.cat.slice(0, cut) + ':' + label : '';
        if (!cat || cat === t.cat) continue;
        t.cat = cat; t.ai = true; applied++;
      }
    }
    im.ai = 'done';
    im.aiNote = applied ? `AI filled in ${applied} — look them over, then tap Add` : 'AI agreed with what was already picked';
  } catch (e) { console.error(e); im.ai = ''; im.aiNote = (e && e.message) || 'The AI is unavailable right now'; }
  const show = () => { if (dialogCtx.sec === 'import' && S.imp === im) refreshEditor(); };
  if (!isEditing()) show(); // mid-typing: wait for the field to be left, then show (focusout is not reliable everywhere)
  else { const w = setInterval(() => { if (!isEditing()) { clearInterval(w); show(); } }, 350); }
}
function importBody() {
  const im = S.imp, months = {};
  for (const t of im.rows) if (t.cat) months[t.key] = (months[t.key] || 0) + 1;
  const missing = Object.keys(months).filter(k => !S.months[k]);
  const ready = im.rows.filter(t => t.cat && !t.dupe && S.months[t.key]).length;
  return `<div class="imp-head muted" style="font-size:12.5px;padding:2px 6px 10px">${im.rows.length} transaction${im.rows.length === 1 ? '' : 's'} read from ${esc(im.name)}${im.dupes ? ` · ${im.dupes} already added` : ''}. Nothing is saved until you tap Add.</div>
    ${aiStrip(im)}<div class="col-body">${im.rows.map((t, i) => `<div class="txrow ${t.dupe ? 'dupe' : ''}" data-tx="${i}">
      <span class="d">${esc(t.desc.slice(0, 70))}</span><span class="amt num ${t.amount < 0 ? '' : 'pos'}">${fmt(t.amount)}</span>
      <span class="meta"><span class="muted" style="font-size:11.5px;white-space:nowrap">${esc(fmtDate(t.date))}${t.ai ? ' · ✨ AI' : ''}${S.months[t.key] ? '' : ' · no ' + esc(monthLabel(t.key))}</span>
      ${t.dupe ? '<span class="muted" style="font-size:11.5px">already added</span>' : t.newCat
        ? `<input class="newcat" data-f="tx-new" data-tx="${i}" placeholder="New category name" value="${esc(t.newName || '')}" autocomplete="off">`
        : `<select data-f="tx-cat" data-tx="${i}">${catOptions(S.months[t.key] || S.months[im.key], t.cat)}</select>`}</span>
    </div>`).join('')}</div>
    ${missing.length ? `<p class="chart-note">${missing.map(k => esc(monthLabel(k))).join(' and ')} ${missing.length === 1 ? 'is' : 'are'} not in the app yet, so those rows will be skipped. Add the month first if you want them.</p>` : ''}
    <div class="dlg-foot" style="padding:12px 0 0"><span class="muted" style="font-size:12px">${ready} ready</span><span class="sp"></span><button class="btn primary sm" data-act="imp-add">${ICON.plus} Add ${ready} to the budget</button></div>`;
}
function catOptions(m, chosen) {
  const have = new Set();
  const group = (col, title) => { const ls = (m[col] || []).filter(l => l.label.trim()); ls.forEach(l => have.add(col + ':' + l.label));
    return ls.length ? `<optgroup label="${title}">${ls.map(l => `<option value="${esc(col + ':' + l.label)}"${chosen === col + ':' + l.label ? ' selected' : ''}>${esc(l.label)}</option>`).join('')}</optgroup>` : ''; };
  const body = `${group('expenses', 'Expenses')}${group('income', 'Net income')}${group('wealth', 'Wealth building')}${group('abnormal', 'Abnormal')}`;
  const fresh = chosen && !have.has(chosen) ? `<optgroup label="New line"><option value="${esc(chosen)}" selected>${esc(chosen.slice(chosen.indexOf(':') + 1))} — new</option></optgroup>` : '';
  return `<option value=""${chosen ? '' : ' selected'}>Skip</option>${fresh}${body}<option value="__new__">+ New category…</option>`;
}
function openImport(rows, key, name) {
  const m = S.months[key];
  const seen = {};
  let dupes = 0;
  for (const t of rows) {
    t.key = t.date.slice(0, 7);
    const base = fingerprint(t); seen[base] = (seen[base] || 0) + 1;
    t.fp = base + (seen[base] > 1 ? '#' + seen[base] : ''); // a second identical charge that day is its own row
    const mm = S.months[t.key] || m;
    t.dupe = !!(S.months[t.key] && (S.months[t.key].imported || []).includes(t.fp));
    if (t.dupe) dupes++;
    t.cat = t.dupe ? '' : suggestCat(mm, t);
    const mk0 = merchantKey(t.desc); t.learned = !!(t.cat && mk0 && S.catMap && S.catMap[mk0] === t.cat); // a filing he taught the app stays his
  }
  S.imp = { rows, key, name, dupes };
  dialogCtx = { key, sec: 'import' };
  openOverlay(`<div class="dlg-head">${pageBack()}<div class="ttl"><h2>Import a statement</h2><span class="muted" style="font-size:13px">Check where each one goes, then add them</span></div></div>
    <div class="dlg-body editor">${importBody()}</div>`);
  dlg.style.maxWidth = '640px';
}
function openImportPick(key) {
  dialogCtx = { key, sec: 'import-pick' };
  openOverlay(`<div class="dlg-head">${pageBack()}<div class="ttl"><h2>Import a statement</h2><span class="muted" style="font-size:13px">What did your bank give you?</span></div></div>
    <div class="dlg-body editor"><div class="list" style="margin:0">
      <button class="lrow" data-act="imp-pdf" data-key="${key}"><span class="sw exp"></span><span class="t">PDF statement<span class="n">The monthly statement your bank posts or emails</span></span>${ICON.chev}</button>
      <button class="lrow" data-act="imp-csv" data-key="${key}"><span class="sw income"></span><span class="t">CSV or spreadsheet<span class="n">From your bank's site: Activity → Download</span></span>${ICON.chev}</button>
    </div>
    <p class="chart-note">The file itself is read on this device and never uploaded. If you tap the AI button on the next screen, only the transaction descriptions and amounts are sent to the AI to be filed.</p></div>`);
  dlg.style.maxWidth = '520px';
}
async function pickStatement(key, kind) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = kind === 'csv' ? '.csv,.txt,.tsv' : '.pdf';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    toast('Reading ' + f.name + '…', 4000);
    try {
      const csv = /\.(csv|txt|tsv)$/i.test(f.name) || (kind === 'csv' && !/\.pdf$/i.test(f.name)); // go by the file, not just the choice
      const rows = csv ? txnsFromCsv(await f.text()) : txnsFromPdf(await pdfRows(f));
      if (!rows.length) { toast('No transactions found in that file', 4000); return; }
      if (dialogCtx.sec === 'import-pick') navBack();
      openImport(rows, key, f.name);
    } catch (e) { console.error(e); toast('Could not read that file: ' + (e.message || 'unknown'), 5000); }
  };
  inp.click();
}
function commitImport() {
  const im = S.imp; if (!im) return;
  const touched = new Set(); let added = 0;
  for (const t of im.rows) {
    if (!t.cat || t.dupe) continue;
    const m = S.months[t.key]; if (!m) continue;
    const [col, label] = [t.cat.slice(0, t.cat.indexOf(':')), t.cat.slice(t.cat.indexOf(':') + 1)];
    if (!COLS.some(c => c.key === col) || !label.trim()) continue;
    m[col] = m[col] || [];
    let l = m[col].find(x => norm(x.label) === norm(label));
    if (!l) { l = { id: uid(), label, amount: 0, items: [] }; m[col].push(l); }
    if (!l.items || !l.items.length) l.items = (+l.amount ? [{ id: uid(), label: 'Already entered', amount: r2(l.amount) }] : []);
    l.items.push({ id: uid(), label: t.desc.slice(0, 80), amount: Math.abs(r2(t.amount)), note: fmtDate(t.date) });
    l.amount = sumFlat(l.items);
    m.imported = [...(m.imported || []), t.fp];
    const mk = merchantKey(t.desc); if (mk && !t.ai) { S.catMap = { ...(S.catMap || {}), [mk]: t.cat }; } // an untouched AI pick isn't learned — only what a person set or corrected teaches the app
    touched.add(t.key); added++;
  }
  for (const k of touched) Store.markDirty(k);
  if (added) Store.saveCatMap();
  S.imp = null; closeOverlay();
  toast(added ? `${added} transaction${added === 1 ? '' : 's'} added to ${[...touched].map(monthLabel).join(' and ')}` : 'Nothing to add', 4000);
  render();
}

/* ---------- boot ---------- */
paintTheme();
render();
Store.init();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    const upd = $('#upd');
    const offer = () => { upd.hidden = false; };
    if (reg.waiting && navigator.serviceWorker.controller) offer();
    reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) offer(); }); });
    // look for new versions when the app comes back to the foreground, and every half hour while open
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    upd.addEventListener('click', () => { upd.disabled = true; upd.textContent = 'Updating…'; if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); else location.reload(); });
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; Store.flushAll().finally(() => location.reload()); });
  }).catch(() => {});
}
</script>
