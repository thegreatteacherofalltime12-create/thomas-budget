<meta charset="utf-8">
<title>Thomas Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thomas Budget">
<meta name="description" content="Monthly household budget for the Thomas family — income, expenses, wealth building, balances and charts, shared between the two of you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f0; --surface:#ffffff; --surface-2:#e9ece4; --surface-3:#dfe3da;
  --ink:#171b17; --ink-2:#555d55; --ink-3:#848b84;
  --line:#dde1d7; --line-2:#c6ccc0;
  --accent:#0f6e56; --accent-ink:#ffffff; --accent-soft:#dcefe7; --accent-line:#8fc8b4;
  --good:#1a7f37; --good-soft:#e1f3e6; --bad:#bf352e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fbefd2;
  --s-income:#2a78d6; --s-exp:#eb6834; --s-wealth:#1baf7a; --s-abn:#eda100; --s-ret:#4a3aa7; --s-debt:#e34948;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 18px 50px rgba(18,28,20,.16), 0 2px 6px rgba(18,28,20,.06);
  --r:10px; --r-s:6px;
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131613; --surface:#1c201c; --surface-2:#252a25; --surface-3:#2f352f;
    --ink:#f1f3ee; --ink-2:#b5bcb3; --ink-3:#7f877f;
    --line:#2c322c; --line-2:#3c433c;
    --accent:#4dbb97; --accent-ink:#0b1a13; --accent-soft:#1c3a2f; --accent-line:#2f6b57;
    --good:#5ccc77; --good-soft:#1b3323; --bad:#f0837a; --bad-soft:#3f2321; --warn:#f2c057; --warn-soft:#3b3012;
    --s-income:#3987e5; --s-exp:#d95926; --s-wealth:#199e70; --s-abn:#c98500; --s-ret:#9085e9; --s-debt:#e66767;
    --grid:#2c2f2c; --axis:#3d423d;
    --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131613; --surface:#1c201c; --surface-2:#252a25; --surface-3:#2f352f;
  --ink:#f1f3ee; --ink-2:#b5bcb3; --ink-3:#7f877f;
  --line:#2c322c; --line-2:#3c433c;
  --accent:#4dbb97; --accent-ink:#0b1a13; --accent-soft:#1c3a2f; --accent-line:#2f6b57;
  --good:#5ccc77; --good-soft:#1b3323; --bad:#f0837a; --bad-soft:#3f2321; --warn:#f2c057; --warn-soft:#3b3012;
  --s-income:#3987e5; --s-exp:#d95926; --s-wealth:#199e70; --s-abn:#c98500; --s-ret:#9085e9; --s-debt:#e66767;
  --grid:#2c2f2c; --axis:#3d423d;
  --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 56px}

/* ---- top bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand .name{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.top nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.ok .dot{background:var(--good)} .pill.busy .dot{background:var(--s-abn)} .pill.local .dot{background:var(--ink-3)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg,.hero-side .hint svg,.badge svg,.tab svg{width:14px;height:14px;flex:none}
.icon{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;color:var(--ink-3);padding:0}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon svg{width:15px;height:15px}
.chartbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:3px 9px 3px 7px;font-weight:600}
.chartbtn:hover{filter:brightness(.96)}
.chartbtn svg{width:13px;height:13px}

/* ---- typography ---- */
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0;font-variation-settings:"opsz" 96}
h1{font-size:34px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---- sections ---- */
.section{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.sec-head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card.click{cursor:pointer;transition:border-color .15s, transform .15s}
.card.click:hover{border-color:var(--accent-line)}

/* ---- home hero ---- */
.hero{margin-top:28px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
.hero-main{padding:26px 28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero-main .figure{font-size:56px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero-main .figure.neg{color:var(--bad)}
.hero-main .lede{max-width:52ch;color:var(--ink-2);font-size:15px}
.hero-main .rule{height:1px;background:var(--line);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.tile{text-align:left;padding:12px 12px 11px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--accent-line)}
.tile .lab{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.sw{width:9px;height:9px;border-radius:3px;flex:none}
.sw.income{background:var(--s-income)} .sw.exp{background:var(--s-exp)} .sw.abn{background:var(--s-abn)} .sw.wealth{background:var(--s-wealth)} .sw.ret{background:var(--s-ret)} .sw.debt{background:var(--s-debt)}
.hero-side{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.hero-side .donut-wrap{display:flex;align-items:center;gap:16px;flex:1}
.hero-side svg{width:150px;height:150px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.legend .li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.legend .li .v{font-weight:600}
.hero-side .hint{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}

/* ---- months table ---- */
.mtable{width:100%;border-collapse:collapse}
.mtable th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 12px;border-bottom:1px solid var(--line)}
.mtable th:first-child{text-align:left}
.mtable td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mtable td:first-child{text-align:left;font-weight:600;font-family:var(--display);font-size:15px}
.mtable tr:last-child td{border-bottom:0}
.mtable tbody tr{cursor:pointer}
.mtable tbody tr:hover td{background:var(--surface-2)}
.mtable .sub{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--body);font-weight:400}
.mtable .cur{display:inline-block;margin-left:8px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px;vertical-align:middle;font-family:var(--body)}
.tscroll{overflow-x:auto}

/* ---- cards grid (trend / debt / balances) ---- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kcard{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard .big{font-size:26px;font-weight:600;letter-spacing:-.02em}
.kcard .delta{font-size:12.5px;color:var(--ink-2)}
.kcard svg.spark{width:100%;height:56px;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv .k{color:var(--ink-2)} .kv .v{font-weight:600}

/* ---- month view ---- */
.mhead{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhead .nav{display:flex;align-items:center;gap:4px}
.mhead h1{font-size:30px}
.mhead .upd{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;margin-left:8px}
.mhead .upd input{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 7px;font-size:13px}
.mhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.perf{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.perf .p{padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.perf .p:hover{border-color:var(--accent-line)}
.perf .p .lab{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;gap:8px;align-items:center}
.perf .p .lab .f{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:0;margin-left:auto;white-space:nowrap}
.perf .p .v{font-size:clamp(20px,2.2vw,26px);font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.perf .p.hero .v{font-size:clamp(24px,2.8vw,32px)}
.cols{margin-top:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.col-head h3{display:flex;align-items:center;gap:8px;font-size:15px}
.col-head .tot{margin-left:auto;font-weight:600;white-space:nowrap}
.col-body{padding:6px 8px 4px;display:flex;flex-direction:column;gap:2px;flex:1}
.col-foot{padding:6px 8px 8px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line)}
.col-foot .chartbtn{margin-left:auto}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 22px 22px;align-items:center;gap:4px;padding:2px 2px 2px 6px;border-radius:6px}
.row:hover{background:var(--surface-2)}
.row input{border:0;background:transparent;padding:5px 6px;border-radius:4px;min-width:0;width:100%}
.row input:hover{background:var(--surface)}
.row input:focus{background:var(--surface);outline:1px solid var(--accent-line);box-shadow:none}
.row input.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.row .calc{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;padding:5px 6px;color:var(--ink-2);cursor:pointer}
.row .calc:hover{text-decoration:underline dotted}
.row .icon{width:22px;height:22px}
.row .icon.on{color:var(--accent);background:var(--accent-soft)}
.items{margin:0 26px 6px 12px;padding:6px 0 4px 10px;border-left:2px solid var(--accent-line);display:flex;flex-direction:column;gap:1px}
.items .row{grid-template-columns:minmax(0,1fr) 84px 22px;padding-left:2px}
.items .row input{font-size:13px;padding:3px 6px}
.items .add{align-self:flex-start;margin-top:4px}
.items .note{font-size:11px;color:var(--ink-3);padding:0 6px 4px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;font-weight:600;border:0;white-space:nowrap}
.badge:hover{filter:brightness(.95)}
.bals{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bals .row{grid-template-columns:minmax(0,1fr) 110px 22px}
.bals .col-head h3{font-size:14px}
.notes{margin-top:20px}
.notes textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}

/* ---- transactions ---- */
.tx-empty{padding:22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.tx-empty p{margin:0;max-width:60ch;color:var(--ink-2)}
.txg{border-bottom:1px solid var(--line)}
.txg:last-child{border-bottom:0}
.txg-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}
.txg-head:hover{background:var(--surface-2)}
.txg-head .n{font-size:12px;color:var(--ink-3)}
.txg-head .t{font-weight:600;white-space:nowrap}
.txg-head .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .15s}
.txg.open .chev{transform:rotate(90deg)}
.txg-body{display:none;padding:2px 8px 10px 14px}
.txg.open .txg-body{display:block}
.txt{width:100%;border-collapse:collapse;font-size:13px}
.txt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.txt tr:last-child td{border-bottom:0}
.txt td.d{white-space:nowrap;color:var(--ink-2);font-family:var(--mono);font-size:12px}
.txt td.a{text-align:right;white-space:nowrap;font-weight:500}
.txt td.desc{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt select,.rev select{max-width:200px;border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;background:var(--surface);font-size:12.5px}
.txg-acts{display:flex;gap:8px;padding:8px 6px 0;flex-wrap:wrap}

/* ---- overlay (charts / dialogs) ---- */
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,980px);width:100%;margin:auto;color:var(--ink)}
dialog::backdrop{background:rgba(10,14,10,.55);backdrop-filter:blur(6px)}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg-head .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.dlg-head h2{font-size:19px}
.dlg-head .x{margin-left:auto}
.dlg-body{padding:16px 18px 18px;overflow:auto}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-foot .sp{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 18px 0}
.tab{border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.chart-area{position:relative}
.chart-note{margin-top:10px;font-size:12.5px;color:var(--ink-2);max-width:70ch}
.vtable{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.vtable th,.vtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.vtable th:first-child,.vtable td:first-child{text-align:left}
.vtable th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:260px;line-height:1.4;transform:translate(-50%,calc(-100% - 10px))}
#tip .tl{font-weight:600}
#tip .tr{display:flex;justify-content:space-between;gap:12px}
#tip .tr .dotk{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* donut + legend in overlay */
.donut-lg{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:26px;align-items:center}
.donut-lg svg{width:100%;height:auto;max-width:300px}
.donut-lg .legend .li{font-size:14px;grid-template-columns:auto 1fr auto auto}
.donut-lg .legend .pct{color:var(--ink-3);min-width:44px;text-align:right}
.donut-seg{transition:opacity .15s}
.donut:hover .donut-seg{opacity:.4}
.donut .donut-seg:hover{opacity:1}
.donut text{fill:var(--ink)}
.donut .ctr-l{fill:var(--ink-3)}

/* hbar chart (HTML) */
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.hb .l{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{position:relative;height:22px}
.hb .track .base{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.hb .bar{position:absolute;top:0;height:22px;border-radius:0 4px 4px 0;min-width:2px;cursor:default}
.hb .bar.negb{border-radius:4px 0 0 4px}
.hb .bar:hover{filter:brightness(1.1)}
.hb .v{text-align:right;font-weight:500;white-space:nowrap}
.hb.tot{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:600}

/* line chart */
.lc{width:100%;height:auto;display:block;overflow:visible}
.lc .grid line{stroke:var(--grid);stroke-width:1}
.lc .grid .zero{stroke:var(--axis)}
.lc text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.lc .endlab{fill:var(--ink);font-size:11.5px;font-weight:600}
.lc .band{fill:transparent}
.lc .xh{stroke:var(--axis);stroke-width:1;opacity:0}
.lc .xh.on{opacity:1}
.lc .mk{stroke:var(--surface);stroke-width:2}
.lc .hl{opacity:0}
.lc .hl.on{opacity:1}
.lgnd{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.lgnd span{display:inline-flex;align-items:center;gap:6px}

<script type="module">

  appId: "1:115126371354:web:97ec170b957f779a73bda3",

let FB = null; // { app, auth, db, A: auth module, F: firestore module }

  const s = abs.toLocaleString('en-US', {style:'currency', currency:'USD', minimumFractionDigits: opts.cents===false?0:2, maximumFractionDigits: opts.cents===false?0:2});

  return { net, exp, abn, wealth, perf:r2(net-exp-abn), exAbn:r2(net-exp), retained:r2(net-exp-abn-wealth), cc:sumFlat(m.cards), cash:sumFlat(m.savings) };
}

  right: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>',
  upload: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M4.5 6.5L8 3l3.5 3.5M3 13h10"/></svg>',
};

  _unsubs: [],
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) {

  },
  async signIn() {

  unsubscribe() { this._unsubs.forEach(u => { try { u(); } catch (e) {} }); this._unsubs = []; },
  subscribe() {

      const next = {};

  markDirty(key) { dirty[key] = true; setSync(S.mode === 'firebase' ? 'busy' : 'local', S.mode === 'firebase' ? 'Saving…' : 'Saved on this device'); clearTimeout(timers[key]); timers[key] = setTimeout(() => this.flush(key), 700); },

  async flush(key) {

  parseBackup(text) {

      for (const col of COLS) doc[col.key] = (Array.isArray(m[col.key]) ? m[col.key] : []).map(l => ({ id: l.id || uid(), label: String(l.label || ''), amount: r2(l.amount), items: (Array.isArray(l.items) ? l.items : []).map(i => ({ id: i.id || uid(), label: String(i.label || ''), amount: r2(i.amount), ...(i.note ? { note: String(i.note) } : {}) })) }));
      for (const b of BALS) doc[b.key] = (Array.isArray(m[b.key]) ? m[b.key] : []).map(r => ({ id: r.id || uid(), label: String(r.label || ''), amount: r2(r.amount) }));
      months[m.key] = doc;
    }

  },
  async restore(data) {
    setSync('busy', 'Restoring…');
    let n = 0;
    for (const key of Object.keys(data.months).sort()) { S.months[key] = data.months[key]; await this.saveMonthNow(key); n++; }
    for (const key of Object.keys(data.tx || {})) { if (Array.isArray(data.tx[key])) { S.tx[key] = data.tx[key]; await this.saveTx(key); } }
    if (data.rules && Object.keys(data.rules).length) { S.rules = { ...S.rules, ...data.rules }; await this.saveRules(); }
    S.dbEmpty = false; toast(`Restored ${n} month${n === 1 ? '' : 's'}`); render();
  }
};

/* ----- transactions grouped by line ----- */
function lineOptions(m, selected) {
  let out = `<option value="" ${!selected?'selected':''}>— unassigned —</option>`;
  for (const col of COLS) {
    out += `<optgroup label="${col.title}">` + (m[col.key]||[]).map(l => `<option value="${col.key}:${l.id}" ${selected===col.key+':'+l.id?'selected':''}>${esc(l.label)}</option>`).join('') + `</optgroup>`;
  }
  out += `<option value="skip" ${selected==='skip'?'selected':''}>Skip (payment / transfer)</option>`;
  return out;
}
function resolveLine(m, ref) { if (!ref || ref==='skip') return null; const [col,id] = ref.split(':'); const l = (m[col]||[]).find(x=>x.id===id); return l ? {col, line:l} : null; }
function txGroupsHTML(key, m, tx) {

  const order = [...groups.keys()].sort((a,b) => (a===''?-1:b===''?1:0) || (a==='skip'?1:b==='skip'?-1:0));
  return order.map(g => {
    const rows = groups.get(g); const res = resolveLine(m, g);
    const title = g==='' ? 'Unassigned' : g==='skip' ? 'Skipped (payments & transfers)' : res ? res.line.label : 'Line no longer exists';
    const sum = r2(rows.reduce((s,t)=>s + (res && res.col==='income' ? t.amount : -t.amount), 0));
    const open = S.view['g:'+key+':'+g] !== false && (g==='' || rows.length <= 1 ? true : !!S.view['g:'+key+':'+g]);
    const sub = res ? COLS.find(c=>c.key===res.col).title : '';
    return `<div class="txg ${open?'open':''}" data-group="${esc(g)}">
      <div class="txg-head" data-act="toggle-group" data-group="${esc(g)}">${ICON.chev.replace('<svg','<svg class="chev"')}<div><span style="font-weight:600">${esc(title)}</span>${sub?` <span class="n">· ${esc(sub)}</span>`:''}${g===''?` <span class="pill warn" style="margin-left:6px">needs a line</span>`:''}</div><span class="n">${rows.length}</span><span class="t num">${fmt(sum)}</span></div>
      <div class="txg-body"><table class="txt num">${rows.sort((a,b)=>a.date<b.date?-1:1).map(t => `<tr data-tx="${t.id}"><td class="d">${esc(t.date.slice(5).replace('-','/'))}</td><td class="desc" title="${esc(t.desc)}">${esc(t.desc)}</td><td class="a ${t.amount>0?'pos':''}">${fmt(-t.amount)}</td><td><select data-f="txline" data-tx="${t.id}" aria-label="Assign to line">${lineOptions(m, t.line)}</select></td></tr>`).join('')}</table>

/* ---------- editing (event delegation) ---------- */
function viewKey() { const m = /^#\/m\/(\d{4}-\d{2})/.exec(location.hash||''); return m ? m[1] : null; }
function findLine(key, col, id) { return (S.months[key][col]||[]).find(l => l.id === id); }
function updateTotals(key) {
  const m = S.months[key], c = calc(m);
  $$('[data-total]').forEach(el => { const k = el.dataset.total; el.textContent = fmt(k==='income'?c.net:k==='expenses'?c.exp:k==='abnormal'?c.abn:k==='wealth'?c.wealth:k==='cards'?c.cc:k==='savings'?c.cash:0); });
  $$('[data-perf]').forEach(el => { const v = c[el.dataset.perf]; el.textContent = fmt(v); el.className = 'v num ' + signCls(v); });
  $$('[data-line-amt]').forEach(el => { for (const col of COLS) { const l = findLine(key, col.key, el.dataset.lineAmt); if (l) { el.textContent = fmt(lineAmt(l)); break; } } });
}

app.addEventListener('input', e => {

app.addEventListener('change', async e => {

app.addEventListener('keydown', e => {

app.addEventListener('click', async e => {

    case 'del-item': { const wrap = t.closest('[data-items]'), row = t.closest('[data-item]'); const col = t.closest('[data-col]').dataset.col; const l = findLine(key, col, wrap.dataset.items); if (!l) break; l.items = l.items.filter(x=>x.id!==row.dataset.item); if (!l.items.length) { l.amount = 0; } Store.markDirty(key); render(); break; }

const dlg = $('#dlg');
function openOverlay(html) { dlg.innerHTML = `<div class="dlg">${html}</div>`; if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0; }

function ask(msg, okLabel='OK') {
  return new Promise(res => {
    openOverlay(`<div class="dlg-head"><div class="ttl"><h2>Are you sure?</h2></div><button class="icon x" data-dact="close">${ICON.x}</button></div>

/* ---------- charts ---------- */
const CHART_TABS = [
  {id:'where', label:'Where it went'}, {id:'expenses', label:'Expenses'}, {id:'income', label:'Income'},
  {id:'wealth', label:'Wealth Building'}, {id:'abnormal', label:'Abnormal'}, {id:'trend', label:'Trend'}, {id:'debt', label:'Debt'},
];
function openCharts(chart, key, keepTable) {
  if (!key || !S.months[key]) key = currentKey(); if (!key) return;
  if (!keepTable) dialogCtx = {};
  dialogCtx.chart = chart; dialogCtx.key = key;
  const m = S.months[key], c = calc(m);
  let title = '', sub = '', body = '', note = '', table = '';
  const barCol = COLS.find(x => x.key === chart);
  if (chart === 'where') {
    title = 'Where the money went'; sub = `${monthLabel(key)} · ${fmt(c.net)} came in`;
    body = donutHTML(m, {size:300});
    note = c.retained < 0 ? `Spending plus wealth building exceeded income by ${fmt(-c.retained)} this month, so there is no “retained” slice. The ring shows how the ${fmt(c.exp+c.abn+c.wealth)} that went out splits up.` : `The ring is the ${fmt(c.net)} of net income. Income Retained is the part left after expenses, abnormal expenses and wealth building.`;
    const rows = donutSegments(m).map(s => [s.label, s.value, c.net ? Math.round(s.value/c.net*1000)/10 + '%' : '']);
    table = tableHTML(['Category','Amount','Share of income'], rows, ['Net Income', c.net, '100%']);
  } else if (barCol) {
    const rows = (m[chart]||[]).map(l => ({label:l.label||'(no label)', value:lineAmt(l)})).filter(r=>r.value!==0).sort((a,b)=>Math.abs(b.value)-Math.abs(a.value));
    const total = c[chart==='income'?'net':chart==='expenses'?'exp':chart==='abnormal'?'abn':'wealth'];
    title = barCol.title; sub = `${monthLabel(key)} · ${rows.length} lines · ${fmt(total)}`;
    body = rows.length ? hbarsHTML(rows, barCol.color, total) : `<div class="empty">Nothing recorded under ${barCol.title} this month.</div>`;
    const top = rows[0]; if (top && total) note = `“${esc(top.label)}” is the largest line at ${fmt(top.value)}, ${Math.round(Math.abs(top.value)/Math.abs(total)*100)}% of the total.`;
    table = tableHTML([barCol.title, 'Amount'], rows.map(r=>[r.label, r.value]), ['Total', total]);
  } else if (chart === 'trend') {
    const keys = sortedKeys();
    title = 'Month by month'; sub = `${keys.length} months · net income, expenses and what was retained`;
    const series = [
      {name:'Net Income', color:'var(--s-income)', values: keys.map(k=>calc(S.months[k]).net)},
      {name:'Expenses', color:'var(--s-exp)', values: keys.map(k=>calc(S.months[k]).exp)},
      {name:'Income Retained', color:'var(--s-ret)', values: keys.map(k=>calc(S.months[k]).retained)},
    ];
    body = keys.length > 1 ? lineChartHTML(series, keys.map(k => shortMonth(k) + (k.endsWith('-01')||k===keys[0]?' ’'+k.slice(2,4):''))) : `<div class="empty">Add a second month to see a trend.</div>`;
    const kept = keys.filter(k=>calc(S.months[k]).retained>=0).length;
    note = `${kept} of ${keys.length} months ended with money retained. Abnormal expenses and wealth building are included in the retained figure, so a big one-off month dips below zero even when regular expenses were covered.`;
    table = tableHTML(['Month', ...series.map(s=>s.name)], keys.map((k,i)=>[monthLabel(k), ...series.map(s=>s.values[i])]));
  } else if (chart === 'debt') {
    const keys = sortedKeys().filter(k => (S.months[k].cards||[]).length);
    const bk = keys.includes(key) ? key : keys[keys.length-1];
    title = 'Credit card debt';
    if (!bk) { sub = 'No card balances recorded yet'; body = `<div class="empty">Add card balances in a month’s Balances block to track debt here.</div>`; }
    else {
      const bm = S.months[bk], bc = calc(bm);
      sub = `${fmt(bc.cc)} across ${(bm.cards||[]).filter(x=>x.amount).length} cards · ${monthLabel(bk)}`;
      const rows = (bm.cards||[]).map(x=>({label:x.label, value:+x.amount||0})).filter(r=>r.value!==0).sort((a,b)=>b.value-a.value);
      body = (keys.length > 1 ? `<div class="eyebrow" style="margin-bottom:8px">Total owed, by month</div>` + lineChartHTML([{name:'Total CC debt', color:'var(--s-debt)', values: keys.map(k=>calc(S.months[k]).cc)}], keys.map(shortMonth), {height:200}) + `<div style="height:18px"></div>` : '')
           + `<div class="eyebrow" style="margin-bottom:8px">By card · ${esc(monthLabel(bk))}</div>` + hbarsHTML(rows, 'var(--s-debt)', bc.cc);
      const first = keys[0]; if (keys.length > 1) { const d = bc.cc - calc(S.months[first]).cc; note = `${d<=0?'Down':'Up'} ${fmt(Math.abs(d))} since ${monthLabel(first)}.`; }
      table = tableHTML(['Card','Balance'], rows.map(r=>[r.label,r.value]), ['Total', bc.cc]);
    }
  }
  openOverlay(`
    <div class="dlg-head"><div class="ttl"><h2>${esc(title)}</h2><span class="muted" style="font-size:13px">${esc(sub)}</span></div><button class="icon x" data-dact="close" title="Close (Esc)">${ICON.x}</button></div>
    <div class="tabs">${CHART_TABS.map(t => `<button class="tab ${t.id===chart?'on':''}" data-dact="tab" data-chart="${t.id}">${t.label}</button>`).join('')}</div>
    <div class="dlg-body"><div class="chart-area">${body}</div>${note?`<p class="chart-note">${note}</p>`:''}${dialogCtx.table ? table : ''}</div>
    <div class="dlg-foot"><span class="muted" style="font-size:12.5px">${['trend','debt'].includes(chart) ? 'Across all months' : esc(monthLabel(key))}</span><span class="sp"></span><button class="btn sm ghost" data-dact="table">${dialogCtx.table?'Hide table':'Show as table'}</button><button class="btn sm" data-dact="close">Close</button></div>`);
  attachChartHover();
}
function tableHTML(head, rows, total) {
  return `<table class="vtable num"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${typeof v==='number'?fmt(v):esc(v)}</td>`).join('')}</tr>`).join('')}${total?`<tr style="font-weight:600">${total.map(v=>`<td>${typeof v==='number'?fmt(v):esc(v)}</td>`).join('')}</tr>`:''}</tbody></table>`;
}

/* donut: Expenses → Wealth → Abnormal → Retained (validated adjacent hue order) */
function donutSegments(m) {
  const c = calc(m);
  const segs = [
    {label:'Expenses', value:c.exp, color:'var(--s-exp)'},
    {label:'Wealth Building', value:c.wealth, color:'var(--s-wealth)'},
    {label:'Abnormal Expenses', value:c.abn, color:'var(--s-abn)'},
    {label:'Income Retained', value:Math.max(0,c.retained), color:'var(--s-ret)'},
  ];
  return segs;
}
function arcPath(cx, cy, r0, r1, a0, a1) {
  const p = (r,a) => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const [x0,y0]=p(r1,a0), [x1,y1]=p(r1,a1), [x2,y2]=p(r0,a1), [x3,y3]=p(r0,a0);
  const large = (a1-a0) > Math.PI ? 1 : 0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r1},${r1} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} A${r0},${r0} 0 ${large} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z`;
}
function donutHTML(m, {size=260, compact=false}={}) {
  const c = calc(m); const segs = donutSegments(m).filter(s => s.value > 0);
  const total = segs.reduce((s,x)=>s+x.value,0) || 1;
  const cx=size/2, cy=size/2, r1=size/2-2, r0=r1-(compact?22:38);
  const gap = 2 / r1; let a = -Math.PI/2; let paths = '';
  segs.forEach(s => {
    const span = s.value/total*Math.PI*2;
    const a0 = a + (segs.length>1?gap/2:0), a1 = a + span - (segs.length>1?gap/2:0);
    if (a1 > a0) paths += `<path class="donut-seg" d="${arcPath(cx,cy,r0,r1,a0,a1)}" fill="${s.color}" data-tip="${esc(s.label)}|${esc(fmt(s.value))} · ${Math.round(s.value/total*100)}%"></path>`;
    a += span;
  });
  if (!segs.length) paths = `<circle cx="${cx}" cy="${cy}" r="${(r0+r1)/2}" fill="none" stroke="var(--surface-3)" stroke-width="${r1-r0}"/>`;
  const centerBig = c.retained < 0 ? fmt(c.exp+c.abn+c.wealth, {cents:false}) : fmt(c.net, {cents:false});
  const centerLab = c.retained < 0 ? 'went out' : 'came in';
  const svg = `<svg class="donut" viewBox="0 0 ${size} ${size}" role="img" aria-label="Where the money went">${paths}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${compact?15:24}" font-weight="600" class="num">${centerBig}</text>
    <text x="${cx}" y="${cy+(compact?14:20)}" text-anchor="middle" font-size="${compact?10:12}" class="ctr-l">${centerLab}</text></svg>`;
  const legend = `<div class="legend">${donutSegments(m).map(s => `<div class="li"><span class="sw" style="background:${s.color}"></span><span class="muted">${s.label}</span>${compact?'':`<span class="pct num">${c.net>0?Math.round(s.value/Math.max(c.net,1)*100)+'%':'—'}</span>`}<span class="v num">${fmt(s.value)}</span></div>`).join('')}
    ${c.retained<0?`<div class="li" style="color:var(--bad)"><span class="sw" style="background:var(--bad)"></span><span>Overspent</span>${compact?'':'<span></span>'}<span class="v num">${fmt(-c.retained)}</span></div>`:''}</div>`;
  return compact ? `<div class="donut-wrap">${svg}${legend}</div>` : `<div class="donut-lg">${svg}${legend}</div>`;
}
function hbarsHTML(rows, color, total) {
  const max = Math.max(0, ...rows.map(r=>r.value)), min = Math.min(0, ...rows.map(r=>r.value));
  const span = (max - min) || 1; const base = (-min)/span*100;
  return `<div class="hbars">${rows.map(r => { const w = Math.abs(r.value)/span*100; const left = r.value >= 0 ? base : base - w;
    return `<div class="hb"><span class="l" title="${esc(r.label)}">${esc(r.label)}</span><div class="track">${min<0?`<span class="base" style="left:${base}%"></span>`:''}<div class="bar ${r.value<0?'negb':''}" style="left:${left}%;width:${Math.max(w,0.6)}%;background:${color}" data-tip="${esc(r.label)}|${esc(fmt(r.value))}${total?` · ${Math.round(Math.abs(r.value)/Math.abs(total)*100)}%`:''}"></div></div><span class="v num">${fmt(r.value)}</span></div>`; }).join('')}
    ${total!==undefined?`<div class="hb tot"><span class="l">Total</span><span></span><span class="v num">${fmt(total)}</span></div>`:''}</div>`;
}
function niceTicks(min, max, n=5) {
  if (min === max) { max = min + 1; }

  $('.rev', dlg).addEventListener('change', e => {
    const tr = e.target.closest('tr[data-rid]'); if (!tr) return; const t = rows.find(x => x.id === tr.dataset.rid); if (!t) return;
    if (e.target.dataset.rf === 'inc') { t.include = e.target.checked; tr.classList.toggle('off', !t.include); }
    if (e.target.dataset.rf === 'line') {
      t.line = e.target.value; const mk = merchantKey(t.desc); const res = resolveLine(m, t.line);
      if (t.line === 'skip') S.rules[mk] = {skip:true}; else if (res) S.rules[mk] = {col:res.col, label:res.line.label}; else delete S.rules[mk];
      let n = 0; rows.forEach(o => { if (o.id !== t.id && merchantKey(o.desc) === mk && o.line !== t.line) { o.line = t.line; n++; } });
      if (t.line && t.line !== 'skip' && !t.include) { t.include = true; tr.classList.remove('off'); tr.querySelector('[data-rf="inc"]').checked = true; }
      if (n) { toast(`Applied to ${n} more “${mk.toLowerCase()}” rows`); renderReview(); }
    }
  });
}
async function commitImport() {
  const { key, rows } = dialogCtx; const inc = rows.filter(t => t.include).map(t => ({ id:t.id, date:t.date, desc:t.desc, amount:t.amount, cat:t.cat, line:t.line }));
  if (!inc.length) { toast('Nothing selected'); return; }
  S.tx[key] = [...(S.tx[key]||[]), ...inc];
  await Store.saveTx(key); await Store.saveRules();
  closeOverlay(); toast(`Imported ${inc.length} transactions into ${monthLabel(key)}`);
  if (viewKey() !== key) location.hash = '#/m/' + key; render();
  setTimeout(() => { const s = $('#txsec'); if (s) s.scrollIntoView({behavior:'smooth', block:'start'}); }, 50);
}

/* ---------- backup & restore ---------- */
function downloadBackup() {
  const blob = new Blob([Store.backupJSON()], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `thomas-budget-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Backup downloaded');
}
function openRestore() {
  openOverlay(`<div class="dlg-head"><div class="ttl"><h2>Restore from a backup</h2><span class="muted" style="font-size:13px">A file made with “Back up”, or the spreadsheet export</span></div><button class="icon x" data-dact="close">${ICON.x}</button></div>
    <div class="dlg-body rev"><div class="drop">
      <label class="btn primary" style="cursor:pointer">${ICON.upload} Choose backup file<input type="file" id="bk-file" accept=".json,application/json" hidden></label>
      <span class="muted" style="font-size:12.5px">Months in the file replace months with the same name; other months are kept.</span>
      <div id="bk-preview"></div>
    </div></div>`);
  dlg.style.maxWidth = '560px'; dlg.addEventListener('close', () => { dlg.style.maxWidth = ''; }, { once: true });
  $('#bk-file').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => {
      let data; try { data = Store.parseBackup(r.result); } catch (err) { $('#bk-preview').innerHTML = `<p class="neg" style="margin:8px 0 0">${esc(err.message)}</p>`; return; }
      dialogCtx.restore = data;
      const keys = Object.keys(data.months).sort(), replacing = keys.filter(k => S.months[k]);
      $('#bk-preview').innerHTML = `<div class="kv num" style="margin-top:8px"><span class="k">Months in file</span><span class="v">${keys.length} (${esc(monthLabel(keys[0]))} – ${esc(monthLabel(keys[keys.length-1]))})</span><span class="k">Would replace existing</span><span class="v">${replacing.length}</span><span class="k">Transactions</span><span class="v">${Object.values(data.tx||{}).reduce((s,a)=>s+(a.length||0),0)}</span></div>
        <button class="btn primary" data-dact="restore-go" style="margin-top:12px">Restore ${keys.length} month${keys.length===1?'':'s'}</button>`;
    };
    r.readAsText(f);
  });
}

/* ---------- boot ---------- */
render();
Store.init();
</script>
